name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/standard.md
            docs/workflow.md
            docs/testing.md
            docs/security.md
            docs/frontend-backend-contracts.md
            docs/ai-agent-contract.md
            docs/threat-model.md
            templates/spec/README.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check repository secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(^|[^A-Za-z])(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!docs/*' ':!README.md'; then
            echo "Potential credential pattern detected."
            exit 1
          fi

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: false

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v3
