name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required documentation
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            docs/standard.md
            docs/workflow.md
            docs/testing.md
            docs/security.md
            docs/frontend-backend-contracts.md
            docs/ai-agent-contract.md
            docs/ai-security.md
            docs/governance.md
            docs/risk-classification.md
            docs/traceability.md
            docs/supply-chain.md
            docs/assurance.md
            docs/definition-of-ready-done.md
            docs/framework-mapping.md
            docs/versioning.md
            templates/spec/README.md
            templates/traceability-matrix.md
            templates/risk/risk-register.md
            templates/security/asvs-verification.md
            templates/evidence/release-evidence.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check repository secrets are not committed
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(^|[^A-Za-z])(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!docs/*' ':!README.md'; then
            echo "Potential credential pattern detected."
            exit 1
          fi

      - name: Check for accidentally committed private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----' -- .; then
            echo "Potential private key detected."
            exit 1
          fi

      - name: Semgrep Community Edition
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check semgrep
          semgrep scan --config auto --error .

  codeql:
    name: CodeQL
    if: ${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.py', '**/*.go', '**/*.java', '**/*.kt', '**/*.c', '**/*.cpp', '**/*.cs', '**/*.rb', '**/*.swift') != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,go,java-kotlin,c-cpp,csharp,ruby,swift

      - name: Analyze
        uses: github/codeql-action/analyze@v3
